[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hammer-evidence"
version = "0.2.0"
description = "Portable cohort checks, source-span review and reproducible experiment receipts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4,<10"]

[project.scripts]
hammer-evidence = "hammer_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
